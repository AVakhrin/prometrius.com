# =============================================================================
# Prometrius OBD2 — PHP для выдачи карты кодов и счётчика
# =============================================================================
#
# КУДА ВСТАВИТЬ: в файл конфигурации nginx, в блок `server { … }` домена
# prometrius.com (тот, где `root /var/www/prometrius.com;`), — ВНУТРЬ, ПОСЛЕ
# существующих блоков `location ~ ^/forum/.+\.php$ { … }`, но ЛЮБОЙ из
# `location / { … }` (регулярки проверяются раньше префиксных).
#
# ЗАЧЕМ. PHP 8.1-fpm на сервере работает, но к нему подключён ТОЛЬКО /forum/.
# Всё остальное падает в `location / { try_files $uri … }` и отдаётся как
# ФАЙЛ — то есть любой .php вне /forum/ сейчас виден как исходник
# (проверено живьём: /downloads/count-downloads.php отдаёт `<?php …`).
#
# ПОРЯДОК ВАЖЕН: nginx перебирает regex-location'ы В ПОРЯДКЕ ПОЯВЛЕНИЯ и
# берёт ПЕРВЫЙ подошедший. Поэтому сначала узкое правило (что разрешаем),
# и только потом запрет на всё остальное.
#
# ПОСЛЕ ПРАВКИ: `sudo nginx -t && sudo systemctl reload nginx`
# =============================================================================

    # 1) РАЗРЕШАЕМ выполнять PHP только там, где он нужен:
    #    карта кодов (mod_a/obd2) и счётчик скачиваний APK (downloads).
    location ~ ^/(mod_a/obd2|downloads)/.+\.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # 2) ЛЮБОЙ ДРУГОЙ .php — НЕ ОТДАВАТЬ КАК ФАЙЛ.
    #    Без этого правила исходники светятся: nginx отдаёт их как
    #    application/octet-stream. 404 честнее, чем утечка.
    location ~ \.php$ {
        return 404;
    }

    # 3) САМИ ДАННЫЕ — ЗАКРЫТЫ ОТ ПРЯМОГО СКАЧИВАНИЯ.
    #    Файл карты отдаёт только getdtc.php (и считает скачивания);
    #    прямой путь в обход счётчика не работает. На выполнение PHP
    #    это не влияет: PHP читает файл с диска напрямую.
    location ^~ /mod_a/obd2/data/ {
        deny all;
        return 403;
    }

# =============================================================================
# ЧТО ПРОВЕРИТЬ ПОСЛЕ ПЕРЕЗАГРУЗКИ (curl с любой машины):
#
#   1) карта отдаётся и считает:
#      curl -sS -o /dev/null -w "%{http_code} %{size_download}\n" \
#           https://prometrius.com/mod_a/obd2/getdtc.php
#      → 200 281546
#
#   2) условный запрос даёт 304 без тела:
#      ET=$(curl -sSI https://prometrius.com/mod_a/obd2/getdtc.php | awk -F': ' '/^ETag/{print $2}' | tr -d '\r')
#      curl -sS -o /dev/null -w "%{http_code}\n" -H "If-None-Match: $ET" \
#           https://prometrius.com/mod_a/obd2/getdtc.php
#      → 304
#
#   3) HEAD работает и НЕ накручивает счётчик:
#      curl -sSI https://prometrius.com/mod_a/obd2/getdtc.php | head -5
#      (проверить, что число в п.4 не изменилось)
#
#   4) счётчик:
#      curl -sS https://prometrius.com/mod_a/obd2/getdtc.php?stat=1
#      → {"file":"dtc_map.bin","downloads":N}   (стартовое 362)
#
#   5) данные напрямую не отдаются:
#      curl -sS -o /dev/null -w "%{http_code}\n" \
#           https://prometrius.com/mod_a/obd2/data/dtc_map.bin
#      → 403
#
#   6) УТЕЧКА ЗАКРЫТА — исходник больше не виден:
#      curl -sS https://prometrius.com/downloads/count-downloads.php | head -2
#      → должно быть ПУСТО/JSON/редирект, НО НЕ `<?php`
# =============================================================================
