<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Prometrius">
    <!-- Знак для вкладки. Упрощён до предела: во вкладке всего 16 точек,
         поэтому ни секторов, ни внешних дуг — только то, что читается. -->

    <!-- Фон — тот же циан, что и корень metr в имени -->
    <rect width="64" height="64" rx="14" fill="#22d3d3"/>

    <!-- Дуга шкалы -->
    <path d="M13 43a19 19 0 0 1 38 0"
          fill="none" stroke="#0b1418" stroke-width="6" stroke-linecap="round"/>

    <!-- Ось прибора -->
    <circle cx="32" cy="45" r="4" fill="#0b1418"/>

    <!-- Стрелка: вперёд и вверх -->
    <path d="M28.5 42.5 47 17 35 48.5z" fill="#0b1418"/>
</svg>
