<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 66" width="250" height="66" role="img" aria-label="Prometrius Lab">
  <g transform="translate(12, 6)">
    <!-- Знак меньше буквенного блока и выровнен по нему по центру -->
    <text x="2" y="38" font-size="40" font-family="'PT Mono', monospace" font-weight="400" fill="#22d3d3" stroke="#22d3d3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" paint-order="stroke fill">∫</text>

    <!-- Строка первая: буквы толще и придвинуты к знаку -->
    <text x="19" y="25" font-size="22" font-family="'PT Mono', monospace" font-weight="700" letter-spacing="0.06em">
      <tspan fill="#eaf6f7">PRO</tspan><tspan fill="#22d3d3">METR</tspan><tspan fill="#eaf6f7">IUS</tspan>
    </text>

    <!-- Строка вторая -->
    <text x="19" y="46" font-size="22" font-family="'PT Mono', monospace" font-weight="700" fill="#9fbcc2" letter-spacing="0.06em">LAB</text>
  </g>
</svg>