<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 200" width="470" height="200" role="img" aria-label="Prometrius Lab">
    <!-- Основной замок: знак интеграла слева, надпись справа.
         Знак и корень METR — циан, остальное — тёмный цвет сайта.
         Интеграл нарисован контуром: он не зависит ни от каких шрифтов. -->

    <!-- Знак интеграла -->
    <path d="M72 46 C 72 32, 58 30, 52 44 C 48 54, 47 66, 45 78 L 40 112 C 38 126, 34 138, 26 146 C 18 154, 8 150, 10 138"
          fill="none" stroke="#22d3d3" stroke-width="9" stroke-linecap="round"/>

    <!-- PROMETRIUS: PRO тёмным, METR цианом, IUS тёмным -->
    <text x="96" y="86" font-family="'PT Mono', 'Courier New', monospace" font-size="46" font-weight="bold" fill="#0b1418">PRO</text>
    <text x="179" y="86" font-family="'PT Mono', 'Courier New', monospace" font-size="46" font-weight="bold" fill="#22d3d3">METR</text>
    <text x="289" y="86" font-family="'PT Mono', 'Courier New', monospace" font-size="46" font-weight="bold" fill="#0b1418">IUS</text>

    <!-- LAB под надписью -->
    <text x="96" y="140" font-family="'PT Mono', 'Courier New', monospace" font-size="46" font-weight="bold" fill="#0b1418" letter-spacing="6">LAB</text>
</svg>